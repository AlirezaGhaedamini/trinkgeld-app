# Supabase CLI configuration.
#
# `project_id` names the local stack; it is not a secret. The remote project is
# bound separately with:
#
#   supabase link --project-ref <your-project-ref>
#
# which writes the reference into supabase/.temp/ (gitignored).

project_id = "tipcrew"

[db]
# Match the linked project so local runs behave identically. The migrations in
# this repository were developed and tested against PostgreSQL 16.
major_version = 15

# ── Edge Functions ──────────────────────────────────────────────────────────
# send-invitation delivers a workplace invitation by email. It is best effort:
# the invitation and its link exist before it is called and do not depend on it.
# verify_jwt stays on — the function authorises the caller with their own JWT
# against normal RLS and uses no service-role key.
[functions.send-invitation]
verify_jwt = true
